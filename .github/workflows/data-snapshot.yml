name: Data snapshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - id: snapshot
        run: python scripts/take_snapshot.py

      - name: Commit new data, if any
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          git config user.name 'wsl-fantasy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/public/data/
          git commit -m "Data snapshot: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push